name: vapemod

on:
  push:
    branches: [ 'claude/**' ]
    paths: [ 'vapemod/**', '.github/workflows/vapemod.yml' ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Commit the built jar to vapemod/dist/'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vapemod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: vapemod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build
        run: ./gradlew build --stacktrace --warning-mode=summary

      - name: Research (javap signatures)
        if: always() && hashFiles('vapemod/.ci/javap-queries.txt') != ''
        run: bash .ci/research.sh

      - name: Server smoke test
        if: success()
        run: bash .ci/smoke-server.sh

      - name: Client smoke test (Xvfb, screenshots in log)
        if: success()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
          bash .ci/smoke-client.sh

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vapemod-jar
          path: vapemod/build/libs/*.jar

      - name: Publish jar to vapemod/dist
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          mkdir -p dist
          rm -f dist/*.jar
          cp build/libs/vapemod-*.jar dist/
          ls -la dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "vapemod: собранный jar" || echo "nothing to commit"
          git push
