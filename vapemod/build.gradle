// Based on the official Forge 26.2 MDK (MinecraftForge/MinecraftForge, branch 26.2, folder mdk/).
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = mod_version
group = 'com.example.vapemod'

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1+, so the mod must target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor "net.minecraftforge:eventbus-validator:${eventbus_version}"
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}

// Fill ${...} placeholders in mods.toml / pack.mcmeta from gradle.properties
def resourceProps = [
    mod_id           : mod_id,
    mod_name         : mod_name,
    mod_version      : mod_version,
    mod_authors      : mod_authors,
    mod_description  : mod_description,
    minecraft_range  : minecraft_version_range,
    forge_range      : forge_version_range,
    loader_range     : loader_version_range,
]

tasks.named('processResources', ProcessResources) {
    inputs.properties resourceProps
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand resourceProps
    }
}
