.bcard{display:flex;justify-content:space-between;gap:14px;align-items:end;flex-wrap:wrap;padding:14px;border:1px solid #293240;border-radius:18px;background:#0b1016;margin-bottom:12px}

.rres{font-size:19px;font-weight:900}
.bopts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.bopt{padding:11px;border-radius:11px;border:1px solid #303b47;background:#101720;color:#fff;cursor:pointer;font-weight:700;font-size:13px}
.bopt.on{border-color:#f3c969;background:#1a1710}
.wn{position:absolute;inset:0}

.wc{position:absolute;inset:31%;border-radius:50%;background:radial-gradient(circle,#e5bf63,#745720 70%);display:grid;place-items:center;color:#17120a;font-weight:900;font-size:44px;z-index:2}
.rnote{display:flex;justify-content:center;gap:10px;align-items:center;color:#8f99a8;font-size:11px;margin:-4px 0 10px}
.zd{width:8px;height:8px;border-radius:50%;background:#18a66d}
.strip{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:900px;margin:10px auto 2px}
.mn{min-width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:900;border:1px solid #303947}
.mn.red{background:#5c1828;color:#ffacb8}
.mn.black{background:#11151a;color:#d9dce2}
.mn.green{background:#0f6045;color:#8ff0c8}
.sh2{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;padding:9px 11px;border-radius:11px;background:#0a0f15;border:1px solid #222a35;min-height:40px;align-items:center}
.sh2 .lbl{font-size:10px;letter-spacing:.12em;color:#8f99a8;text-transform:uppercase;margin-right:5px}
.sc{min-width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:900;padding:0 5px}
.sc.red{background:#5c1828;color:#ffacb8}
.sc.black{background:#11151a;color:#d9dce2;border:1px solid #303947}
.sc.green{background:#0f6045;color:#8ff0c8}
.sc.dice{background:#1a2634;color:#88baff}
.sc.crash{background:#2d1a2a;color:#ff86b7}
.svar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;padding:4px;border:1px solid #27313d;border-radius:12px;background:#090e14}
.svb{border:0;background:transparent;color:#8f99a8;padding:8px 12px;border-radius:9px;font-weight:800;cursor:pointer;font-size:12px}
.svb.on{background:#171f29;color:#fff}
.rrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:700px;margin:0 auto}
.rf{padding:6px;border-radius:18px;background:linear-gradient(145deg,#6c8a9e,#252e39 38%,#10151b 70%)}
.reel{height:120px;display:grid;place-items:center;border-radius:12px;border:2px solid #677587;background:radial-gradient(circle at 45% 20%,#273143,#10161e 70%);overflow:hidden}
.reel.sp{animation:rsh .07s linear infinite;filter:blur(1.4px)}
@keyframes rsh{0%{transform:translateY(-5px)}50%{transform:translateY(5px)}100%{transform:translateY(-5px)}}
.sym{font-size:28px;text-align:center;line-height:1}
.sym small{display:block;font-size:9px;margin-top:2px}
.paytable{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.pay{padding:9px;border:1px solid #28313d;border-radius:11px;background:#0c1117;font-size:12px}
.pay .s{font-weight:900}
.pay small{color:#8f99a8}
/* ==== SLOT THEMES ==== */
.slot-frame{border:1px solid #323c47;border-radius:20px;background:#0a0f15;padding:20px;margin-top:12px;transition:.3s}
.slot-frame[data-slot="classic"]{background:linear-gradient(180deg,#2a0f0f,#0a0f15);border-color:#7c3a1a}
.slot-frame[data-slot="classic"] .slot-marquee{color:#ffb84a;border-bottom-color:rgba(255,184,74,.3)}
.slot-frame[data-slot="classic"] .swin{border-color:#b8862d;background:linear-gradient(180deg,#3a1010,#160a04)}
.slot-frame[data-slot="classic"] .rf{background:linear-gradient(145deg,#d4a054,#7c4a1a 38%,#2a1404 70%)}
.slot-frame[data-slot="classic"] .reel{border-color:#b8862d;background:radial-gradient(circle at 45% 20%,#4a1a08,#160a04 70%)}
.slot-frame[data-slot="book"]{background:linear-gradient(180deg,#1a0a2a,#0a0f15);border-color:#5a3a7a}
.slot-frame[data-slot="book"] .slot-marquee{color:#c78cff;border-bottom-color:rgba(199,140,255,.3)}
.slot-frame[data-slot="book"] .swin{border-color:#7a4aa0;background:linear-gradient(180deg,#231542,#0d0518)}
.slot-frame[data-slot="book"] .rf{background:linear-gradient(145deg,#a070d0,#4a2a6a 38%,#160820 70%)}
.slot-frame[data-slot="book"] .reel{border-color:#7a4aa0;background:radial-gradient(circle at 45% 20%,#3a1a5a,#0d0518 70%)}
.slot-frame[data-slot="mega"]{background:linear-gradient(180deg,#0a1a2a,#0a0f15);border-color:#2a6b8a}
.slot-frame[data-slot="mega"] .slot-marquee{color:#55d9ff;border-bottom-color:rgba(85,217,255,.3)}
.slot-frame[data-slot="mega"] .swin{border-color:#2a6b8a;background:linear-gradient(180deg,#0a2030,#04101a)}
.slot-frame[data-slot="mega"] .rf{background:linear-gradient(145deg,#55d9ff,#2a5a7a 38%,#04101a 70%)}
.slot-frame[data-slot="mega"] .reel{border-color:#2a6b8a;background:radial-gradient(circle at 45% 20%,#0a2a3a,#04101a 70%)}
.slot-marquee{display:flex;justify-content:space-between;padding:8px 12px;margin:-4px -2px 12px;border-bottom:1px solid rgba(243,201,105,.16);font-size:11px;letter-spacing:.18em;font-weight:900}
.swin{padding:12px;border:2px solid #7c6231;border-radius:20px}
.db,.cb,.bt,.vp,.bc,.pk{padding:22px;border:1px solid #2e3845;border-radius:22px;background:#0a0f15;min-height:280px}
.dpl{display:grid;grid-template-columns:1fr 60px 1fr;gap:12px;align-items:stretch}
.dp{padding:16px;border:1px solid #2b3542;border-radius:16px;background:#0d131b;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:230px}
.dpips{font-size:60px;letter-spacing:10px;margin:20px 0 10px;line-height:1}
.dcap{color:#8f99a8;font-size:12px}
.sum{font-size:38px;font-weight:900}
.vs{display:grid;place-items:center;color:#f3c969;font-weight:900}
.rb{text-align:center;font-size:22px;font-weight:900;margin:14px 0}
.cchart{height:240px;border:1px solid #2c3541;border-radius:18px;position:relative;overflow:hidden;background:#0a0f15;margin:10px 0}
.cline{position:absolute;left:8%;bottom:11%;height:4px;width:10%;transform-origin:left center;background:linear-gradient(90deg,#30d28d,#f3c969,#ff5470)}
.cm{font-size:56px;font-weight:900;text-align:center}
.crow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:120px}
.card{width:78px;height:108px;border-radius:11px;background:#f9f7f1;color:#12151a;border:1px solid #dbd4c4;display:flex;flex-direction:column;justify-content:center;padding:7px;font-weight:900;position:relative;transition:.2s}
.card.red{color:#c62340}
.card.back{background:repeating-linear-gradient(45deg,#3b1f2b,#3b1f2b 6px,#7f3b4e 6px,#7f3b4e 10px);color:transparent;border-color:#a35a6b}
.cc{position:absolute;display:flex;flex-direction:column;line-height:.92;align-items:center;font-size:16px}
.cc.t{left:8px;top:7px}

.cc span{font-size:10px}
.ccs{font-size:36px;text-align:center}

.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-5px)}
.bh{text-align:center;margin:12px}
.bh h4{margin:0 0 8px;color:#cfdbc9;font-size:13px;letter-spacing:.1em}
.ba{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.mb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:grid;place-items:center;padding:15px}
.mc{width:min(700px,calc(100vw - 30px));max-height:88vh;overflow:auto;border:1px solid #3a4552;border-radius:22px;background:#0d131a;padding:20px}
.mh{display:flex;justify-content:space-between;align-items:center}
.mh h3{margin:0;font-size:22px}
.close{border:0;background:#17202b;color:#fff;width:34px;height:34px;border-radius:10px;cursor:pointer}
.shopg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.si{border:1px solid #2b3540;border-radius:14px;background:#0b1117;padding:12px}
.si.owned{border-color:#4d5f46}
.sit{font-weight:900;font-size:14px}
.sid{font-size:11px;color:#8f99a8;margin:4px 0 10px}
.ts{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#f3c969}
.tt2{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.cstat{margin-top:11px;padding:10px 12px;border-radius:11px;background:#0b1117;color:#8f99a8;font-size:12px}
.ok{color:#30d28d}
.err{color:#ff5470}
.tstack{position:fixed;right:18px;bottom:70px;z-index:70;display:grid;gap:8px}
.toast{min-width:250px;max-width:360px;padding:12px 14px;border-radius:13px;border:1px solid #384351;background:#0d131a;animation:ti .25s}
.toast strong{display:block;font-size:13px}
.toast small{display:block;color:#8f99a8;margin-top:3px;font-size:11px}
@keyframes ti{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.muted{color:#8f99a8}
.wpulse{animation:wp .7s}
@keyframes wp{0%{box-shadow:inset 0 0 0 1px rgba(243,201,105,.08),0 0 0 0 rgba(243,201,105,.8)}100%{box-shadow:inset 0 0 0 1px rgba(243,201,105,.08),0 0 0 32px rgba(243,201,105,0)}}
.fwin{position:fixed;font-size:24px;font-weight:900;color:#30d28d;z-index:75;pointer-events:none;animation:fw 1.5s ease-out forwards;text-shadow:0 0 14px rgba(48,210,141,.7)}
@keyframes fw{0%{opacity:0}18%{opacity:1;transform:translateY(-12px) scale(1.1)}100%{opacity:0;transform:translateY(-90px) scale(1)}}
.wparts{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.wparts .w{position:absolute;top:-40px;animation:wf linear forwards}
@keyframes wf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(115vh) rotate(720deg);opacity:.4}}
.wov{position:fixed;inset:0;z-index:80;pointer-events:none;display:grid;place-items:center;opacity:0}
.wov.show{animation:wvf 2.8s ease forwards}
@keyframes wvf{0%{opacity:0}8%{opacity:1}82%{opacity:1}100%{opacity:0}}

.wcard{position:relative;text-align:center;padding:34px 48px;border-radius:26px;border:2px solid #f3c969;background:linear-gradient(160deg,rgba(30,20,10,.95),rgba(10,10,15,.98));box-shadow:0 0 60px rgba(243,201,105,.4);transform:scale(0)}
.wov.show .wcard{animation:wpop .8s cubic-bezier(.15,1.5,.5,1) forwards}
@keyframes wpop{0%{transform:scale(.2) rotate(-8deg);opacity:0}60%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.wtier{font-size:13px;letter-spacing:.4em;text-transform:uppercase;color:#f3c969;font-weight:900;margin-bottom:10px}
.wamt{font-size:64px;font-weight:900;line-height:1;background:linear-gradient(135deg,#fff0b2,#f3c969,#ff86b7);-webkit-background-clip:text;background-clip:text;color:transparent}
.wmult{font-size:20px;color:#55d9ff;font-weight:900;margin-top:8px}
.wsub{color:#8f99a8;font-size:12px;margin-top:6px;letter-spacing:.14em;text-transform:uppercase}

function settle(bet,pay,meta){
 meta=meta||{};
 if(typeof bet!=='number'||!isFinite(bet))bet=0;
 if(typeof pay!=='number'||!isFinite(pay))pay=0;
 var ev=week();
 pay=Math.floor(pay*ev.m);
 if(!isFinite(pay))pay=0;
 var net=pay-bet;
 state.totalBet+=bet;state.games++;
 if(net>0){
  state.wins++;state.totalWon=(state.totalWon||0)+net;pushH('W');
  state.biggestWin=Math.max(state.biggestWin,net);
  if(net>=1000)unlock(7);
  if(!state.ach[0])unlock(0);
  addXp(2);play('win');
  var nv=vLvl();
  if(nv>state.vip){state.vip=nv;toast('VIP '+VIP[nv].n,'Минимум '+VIP[nv].mb+' E');play('bonus')}
  winOverlay(net,bet,meta);
  tickQ('win',1);
 }else if(net<0){state.losses++;pushH('L');addXp(1);play('lose')}
 else{pushH('P');addXp(1)}
 addMoney(pay);
 if(state.balance>=10000)unlock(3);
 if(meta.allIn&&net>0)unlock(4);
 save();top();bankruptCheck();
 return net;
}

// Логика победы: слева направо
function evalSlotsLine(final){
 // final: массив индексов символов [0,1,2]
 // Возвращает {cnt: 0|2|3, sym: индекс символа, isScatter: bool}
 var a=final[0],b=final[1],c=final[2];
 // Scatter трипл — особая награда
 if(a===7&&b===7&&c===7)return {cnt:3,sym:7,isScatter:true};
 // Тройка с учётом Егорика (6)
 var arr=[a,b,c].filter(function(x){return x!==6});
 if(arr.length===0){return {cnt:3,sym:6}} // три Егорика — тоже bonus
 var uniq={};arr.forEach(function(x){uniq[x]=1});
 if(Object.keys(uniq).length===1)return {cnt:3,sym:arr[0]};
 // Пара — только слева (первые два или Егорик+один)
 var firstPair=false, pairSym=null;
 if(a!==6&&b!==6&&a===b){firstPair=true;pairSym=a}
 else if(a===6&&b!==6){firstPair=true;pairSym=b}
 else if(a!==6&&b===6){firstPair=true;pairSym=a}
 else if(a===6&&b===6){firstPair=true;pairSym=(c!==6&&c!==7)?c:6}
 if(firstPair)return {cnt:2,sym:pairSym};
 return {cnt:0,sym:null};
}

function evalHand(cards){

 var suitCount={};suits.forEach(function(s){suitCount[s]=(suitCount[s]||0)+1});
 var flushSuit=null;for(var s in suitCount)if(suitCount[s]>=5)flushSuit=+s;
 var rankCount={};r14.forEach(function(r){rankCount[r]=(rankCount[r]||0)+1});
 var groups=[];for(var k in rankCount)groups.push([+k,rankCount[k]]);
 groups.sort(function(a,b){if(a[1]!==b[1])return b[1]-a[1];return b[0]-a[0]});
 var sfHigh=0;
 if(flushSuit!==null){
  var suited=cards.filter(function(c){return c.s===flushSuit}).map(function(c){return c.r===1?14:c.r}).sort(function(a,b){return b-a});
  var chk=suited.slice();if(chk.indexOf(14)>=0)chk.push(1);
  for(var i=0;i<=chk.length-5;i++){if(chk[i]-chk[i+4]===4){var ok=true;for(var j=1;j<5;j++)if(chk[i+j-1]-chk[i+j]!==1){ok=false;break}if(ok){sfHigh=chk[i];break}}}
 }
 if(sfHigh)return {rank:sfHigh===14?9:8,name:sfHigh===14?'Роял-флеш':'Стрит-флеш',tb:[sfHigh]};
 if(groups[0][1]===4)return {rank:7,name:'Каре',tb:[groups[0][0],groups[1]?groups[1][0]:0]};

 if(flushSuit!==null){var high5=cards.filter(function(c){return c.s===flushSuit}).map(function(c){return c.r===1?14:c.r}).sort(function(a,b){return b-a}).slice(0,5);return {rank:5,name:'Флеш',tb:high5}}
 var uniq=groups.map(function(g){return g[0]});
 var check=uniq.slice();if(check.indexOf(14)>=0)check.push(1);check.sort(function(a,b){return b-a});
 var straightHigh=0;
 for(var i2=0;i2<=check.length-5;i2++){if(check[i2]-check[i2+4]===4){var ok2=true;for(var j2=1;j2<5;j2++)if(check[i2+j2-1]-check[i2+j2]!==1){ok2=false;break}if(ok2){straightHigh=check[i2];break}}}
 if(straightHigh)return {rank:4,name:'Стрит',tb:[straightHigh]};
 if(groups[0][1]===3)return {rank:3,name:'Тройка',tb:[groups[0][0],groups[1]?groups[1][0]:0,groups[2]?groups[2][0]:0]};
 if(groups[0][1]===2&&groups[1]&&groups[1][1]===2)return {rank:2,name:'Две пары',tb:[groups[0][0],groups[1][0],groups[2]?groups[2][0]:0]};
 if(groups[0][1]===2)return {rank:1,name:'Пара',tb:[groups[0][0],groups[1]?groups[1][0]:0,groups[2]?groups[2][0]:0,groups[3]?groups[3][0]:0]};

}

 var w=Math.floor(Math.random()*5000)+50;
 var ic=rnd(['\uD83D\uDCB0','\uD83C\uDFB0','\uD83C\uDFB2','\uD83C\uDCCF','\u2726']);
 var badge=title?'<span class="tbadge '+cls+'">'+title+'</span>':'';
 return '<span class="ti2">'+ic+' '+badge+' <b>'+name+'</b> выиграл '+fmt(w)+' E · '+g+'</span>';
}
function updTicker(){var t=$('#ttk');if(!t)return;var items=[];for(var i=0;i<14;i++)items.push(tickItem());var s=items.join('');t.innerHTML=s+s}

// Чат: обычные + 2 редких спец-сообщения
var CMSG=['Ставлю на красное!','Кто в Crash?','Забрал x50 🚀','Слоты сегодня злые','Спасибо за казино!','Баккара топ','Кости злые','777 поймал 🎰','Донат Егору!','Удачи всем!','Проиграл всё 😭','x100 в слотах!','Покер жара!'];
var CMSG_GORILLA=['Энергетик GORILLA заходит лучше всего ⚡','GORILLA держит в тонусе 🦍⚡','Банка GORILLA и в казино 🥤','Кто ещё на GORILLA? 💚'];
var CMSG_BOSS=['Да Егор настоящий BOSS 👑','Егор — BOSS этого казино','Boss зашёл — всем удача!','Да Егор настоящий BOSS 🔥'];
function addChatLine(){
 var c=$('#cmsgs');if(!c)return;
 var div=document.createElement('div');div.className='cmsg';
 var r=Math.random();
 // ~5% GORILLA
 if(r<0.05){
  div.classList.add('gorilla');
  div.innerHTML='\uD83E\uDD8D <b style="color:#30d28d">GORILLA</b> · '+rnd(CMSG_GORILLA);
 }
 // ~5% BOSS
 else if(r<0.10){
  div.classList.add('boss');
  div.innerHTML='\uD83D\uDC51 '+rnd(CMSG_BOSS);
 }
 // 40% с игроком
 else if(Math.random()<0.45){
  var p=rnd(PLAYERS);
  var nameColor=p.cls==='gold'?'#f3c969':p.cls==='violet'?'#b56cff':p.cls==='cyan'?'#55d9ff':'#30d28d';
  div.innerHTML='<b style="color:'+nameColor+'">'+p.n+':</b> <span class="tbadge '+p.cls+'">'+p.t+'</span> '+rnd(CMSG);
 }
 // обычное
 else{
  var n=rnd(EXTRA);
  div.innerHTML='<b style="color:#88baff">'+n+':</b>'+rnd(CMSG);
 }
 c.appendChild(div);
 while(c.children.length>7)c.removeChild(c.firstChild);
}
setInterval(addChatLine,4500);

document.addEventListener('keydown',function(e){
 if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
 if(e.key==='Escape'){closeM();home()}
 if(e.key===' '){e.preventDefault();var p=$('#playBtn');if(p&&!p.disabled)p.click()}
 if(e.key==='t'||e.key==='T'){TURBO=TURBO===1?2:TURBO===2?4:1;state.turbo=TURBO;save();$$('[data-turbo]').forEach(function(x){x.textContent='ТУРБО ×'+TURBO})}
 if(currentGame==='blackjack'){if(e.key==='1'){var b1=$('#hitB');if(b1)b1.click()}if(e.key==='2'){var b2=$('#stB');if(b2)b2.click()}}
});

document.addEventListener('click',function(e){
 var g=e.target.closest?e.target.closest('[data-game]'):null;
 if(g&&g.dataset.game){startGame(g.dataset.game);return}
 var a=e.target.closest?e.target.closest('[data-act]'):null;
 if(!a)return;
 var act=a.dataset.act;
 if(act==='home')home();
 else if(act==='settings')settingsM();
 else if(act==='shop')shopM();
 else if(act==='achievements')achM();
 else if(act==='stats')statsM();
 else if(act==='rules')rulesM();
 else if(act==='random-game')randomGame();
 else if(act==='donate')showDonate();
 else if(act==='edit-name')nameM();
 else if(act==='skills')skillsM();
 else if(act==='title')titleM();
});

try{
 refreshQ();
 applyShop();
 top();
 renderHome();
 updTicker();
 if(!state.name)setTimeout(nameM,300);
 setInterval(function(){if(Math.random()<.5)updTicker()},9000);
 setInterval(function(){var o=$('#ol');if(o)o.textContent=String(340+Math.floor(Math.random()*130))},4000);
 var chatH=$('#chatH');
 if(chatH)chatH.onclick=function(){var c=$('#chat');c.classList.toggle('min');var t=$('#chatT');if(t)t.textContent=c.classList.contains('min')?'+':'−'};
}catch(err){
 document.body.innerHTML+='<div style="position:fixed;bottom:10px;left:10px;right:10px;background:#5c1828;color:#fff;padding:12px;border-radius:10px;z-index:9999;font-family:monospace;font-size:12px">Ошибка запуска: '+(err.message||err)+'</div>';
}
})();
</script>
