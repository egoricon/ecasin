<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060D">
<meta name="description" content="Егор Казино — фан-казино на вымышленные Егорики: рулетка, слоты, Crash, блэкджек, баккара, холдем, видеопокер, кости и кликер «Ботать в БГУИР».">
<title>EGOR CASINO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307060D'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23FF3EA5'/%3E%3Ctext x='32' y='43' font-family='Arial Black,Arial' font-weight='900' font-size='30' text-anchor='middle' fill='%232E0419'%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Onest:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/games.css">
</head>
<body class="ds" data-mode="casino">

<header class="topbar">
  <button class="brand" data-go="casino" aria-label="Егор Казино — на главную">ЕГОР <em>КАЗИНО</em></button>
  <div class="top-mid">
    <div class="seg" role="group" aria-label="Режим">
      <button data-go="casino" data-mode-btn="casino" aria-pressed="true">Казино</button>
      <button data-go="earn" data-mode-btn="earn" aria-pressed="false">Заработок</button>
    </div>
  </div>
  <div class="top-bal">
    <div class="bal" id="balPill" title="Баланс"><i aria-hidden="true">◆</i><b id="balNum">100</b><span class="clover" id="balClover" aria-label="Клевер удачи"></span><span>Егориков</span></div>
    <span class="online" aria-label="Игроков онлайн"><i></i><span id="onlineNum">427</span> онлайн</span>
  </div>
  <div class="top-right">
    <button class="who" data-go="profile" aria-label="Профиль"><span class="av" id="whoAv">👤</span><span class="who-txt"><span class="who-name" id="whoName">Игрок</span><span id="whoTitle"></span></span></button>
    <button class="btn b-gho icon" data-go="donate" aria-label="Поддержать Егора" title="Поддержать Егора">💝</button>
    <button class="btn b-gho icon" data-go="settings" aria-label="Настройки" title="Настройки">⚙️</button>
  </div>
</header>

<main class="shell" id="main">
  <section id="homeView" class="view" aria-label="Главная"></section>
  <section id="gameView" class="view" aria-label="Игра"></section>
  <section id="donateView" class="view" aria-label="Донат"></section>
  <section id="earnView" class="view" aria-label="Заработок"></section>
</main>

<div id="notes" class="notes" aria-live="polite"></div>
<div id="modalRoot"></div>

<div class="ticker" aria-hidden="true"><span class="live"><i></i>LIVE</span><div class="ticker-track" id="tickerTrack"></div></div>
<aside class="chat" id="chat" aria-label="Лайв-чат">
  <button class="chat-head" id="chatToggle" aria-expanded="true"><span>💬 Лайв-чат</span><span id="chatSign">−</span></button>
  <div class="chat-body" id="chatBody"></div>
</aside>

<noscript><p style="padding:24px;text-align:center">Для игры нужен JavaScript.</p></noscript>

<!-- Ядро и правила (без DOM, их же грузят тесты) -->
<script defer src="js/core/util.js"></script>

<script defer src="js/app.js"></script>
</body>
</html>
