<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090c">
<title>EGOR CASINO 4.3</title>
<style>
:root{--bg:#07090c;--panel:#0e1218;--line:#293241;--text:#f5f7fb;--muted:#8f99a8;--gold:#f3c969;--green:#30d28d;--red:#ff5470;--cyan:#55d9ff;--violet:#b56cff;--shadow:0 24px 80px rgba(0,0,0,.45)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#19202c 0,#090c11 42%,#05070a 100%);color:var(--text)}
body{overflow-x:hidden}.ambient{position:fixed;filter:blur(70px);opacity:.18;pointer-events:none;border-radius:50%;z-index:0}.ambient-a{width:330px;height:330px;background:#7e4cff;left:-120px;top:120px}.ambient-b{width:360px;height:360px;background:#f0b21b;right:-160px;bottom:80px}
/* TOPBAR */
.topbar{position:sticky;top:0;z-index:20;min-height:78px;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;gap:14px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(5,7,10,.78);backdrop-filter:blur(18px);flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.brand{border:0;background:none;color:var(--text);font-weight:900;font-size:17px;letter-spacing:.13em;display:flex;align-items:center;gap:10px;cursor:pointer}.brand b{color:var(--gold)}.brand-mark{font-size:22px;color:var(--gold)}
.balance-card{border:1px solid #4b4126;background:linear-gradient(180deg,#111722,#0b0e13);border-radius:14px;padding:8px 14px;display:flex;align-items:center;gap:8px;box-shadow:inset 0 0 0 1px rgba(243,201,105,.08)}
.balance-card .coin{color:var(--gold)}.balance-card strong{font-size:18px}.balance-card span:last-child{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.icon-btn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:#0e141c;color:var(--text);cursor:pointer;font-size:19px}
.icon-btn:hover{border-color:#546074;background:#151c28}
.name-btn{border:1px solid var(--line);background:linear-gradient(180deg,#111722,#0b0e13);color:var(--text);border-radius:14px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:9px;cursor:pointer;font-weight:800;font-size:13px;transition:.2s}
.name-btn:hover{border-color:#546074;background:#151c28}
.avatar-img{width:32px;height:32px;border-radius:50%;border:2px solid #4b4126;object-fit:cover;background:#1a1408;flex-shrink:0}
.name-btn .crown-mark{color:var(--gold);font-size:15px;filter:drop-shadow(0 0 6px rgba(243,201,105,.6))}
.donate-btn{border:1px solid #4a2e40;background:linear-gradient(180deg,#221626,#140d18);color:#ffb8d4;border-radius:14px;padding:0;width:42px;height:42px;cursor:pointer;font-size:17px;transition:.2s;display:grid;place-items:center}
.donate-btn:hover{border-color:#ff7eb0;background:#2a182e;transform:translateY(-1px)}
/* APP */
.app-shell{position:relative;z-index:1;width:min(1240px,calc(100% - 32px));margin:0 auto;padding:26px 0 60px}.view{display:none}.view.active{display:block}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:18px}.hero-card{min-height:310px;border:1px solid #3b3524;border-radius:28px;padding:30px;background:linear-gradient(140deg,rgba(55,47,26,.56),rgba(17,20,25,.95) 50%,rgba(18,16,26,.98));box-shadow:var(--shadow);overflow:hidden;position:relative}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.2em;color:var(--gold);font-weight:800}.hero h1{font-size:54px;line-height:.95;margin:12px 0 16px;max-width:600px}.hero h1 span{color:var(--gold)}.hero p{max-width:610px;color:#adb6c4;line-height:1.65;margin:0 0 22px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.primary,.secondary,.danger,.game-btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;transition:.2s}
.primary{background:linear-gradient(135deg,#ffd87b,#c58b25);color:#120f08;box-shadow:0 12px 30px rgba(243,201,105,.18)}.primary:hover{transform:translateY(-2px)}
.secondary{background:#131a23;border:1px solid #344050;color:var(--text)}.secondary:hover,.game-btn:hover{border-color:#596779;transform:translateY(-1px)}
.danger{background:rgba(255,84,112,.11);color:#ff91a2;border:1px solid rgba(255,84,112,.28)}
.quick-panel{border:1px solid #27303b;border-radius:28px;padding:22px;background:linear-gradient(180deg,#121721,#0b0f15);box-shadow:var(--shadow);display:flex;flex-direction:column}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.stat{padding:15px;border-radius:16px;border:1px solid #27303b;background:#0c1117}.stat .k{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.12em}.stat .v{font-size:25px;font-weight:900;margin-top:4px}
.vip{margin-top:auto;padding:14px;border-radius:15px;background:linear-gradient(135deg,rgba(243,201,105,.1),rgba(181,108,255,.08));border:1px solid #51462c}.vip strong{color:var(--gold)}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:30px 0 13px}.section-head h2{margin:0;font-size:22px}.section-head p{margin:0;color:var(--muted);font-size:13px}
.game-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.game-card{position:relative;min-height:180px;border:1px solid #26303b;border-radius:22px;background:linear-gradient(180deg,#111720,#0c1016);padding:18px;cursor:pointer;overflow:hidden;transition:.25s}.game-card:hover{transform:translateY(-5px);border-color:#566170}
.game-card .art{font-size:40px;margin-bottom:28px}.game-card .title{font-weight:900;font-size:17px}.game-card .desc{font-size:12px;color:var(--muted);line-height:1.45;margin-top:5px}.game-card .tag{position:absolute;top:14px;right:14px;color:var(--gold);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.bottom-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:18px}.panel{border:1px solid #27303b;border-radius:22px;background:linear-gradient(180deg,#111720,#0a0e13);padding:20px;box-shadow:var(--shadow)}
.ach-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.ach{padding:13px;border:1px solid #252e3a;border-radius:15px;background:#0c1117}.ach.done{border-color:#3c503e;background:rgba(48,210,141,.06)}.ach .name{font-weight:800}.ach .desc{color:var(--muted);font-size:12px;margin-top:4px}
.progress{height:7px;border-radius:99px;background:#19202a;overflow:hidden;margin-top:8px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green));width:0}
.game-layout{display:grid;grid-template-columns:280px 1fr;gap:16px}.game-side{border:1px solid #27303b;border-radius:24px;background:#0d1219;padding:18px;height:max-content;position:sticky;top:96px}
.game-side h3{margin:0 0 8px}.game-side p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.side-stat{margin-top:15px;padding:13px;border-radius:15px;background:#090e14;border:1px solid #222a35}.side-stat b{display:block;font-size:24px;margin-top:3px}
.game-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:7px}.game-title{font-size:30px;margin:0}.game-sub{color:var(--muted);font-size:13px;margin-top:5px}
.control-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:7px;min-width:150px}.field label{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.12em}
.input{height:44px;border-radius:12px;border:1px solid #313b47;background:#090e14;color:var(--text);padding:0 13px;font-size:15px;outline:0}.input:focus{border-color:#6d7a8a}
.betting-card{display:flex;justify-content:space-between;gap:15px;align-items:end;flex-wrap:wrap;padding:17px;border:1px solid #293240;border-radius:20px;background:#0b1016;margin-bottom:14px}
.preset-row{display:flex;gap:7px;flex-wrap:wrap}.preset{border:1px solid #303b49;background:#111923;color:#cbd2dc;border-radius:10px;padding:8px 10px;font-size:12px;cursor:pointer}
.game-btn{border:1px solid #344253;background:#141d29;color:#fff}.game-btn.primary-gold{background:linear-gradient(135deg,#f4d27e,#b8862d);color:#181208;border:0}.game-btn.red{background:rgba(255,84,112,.12);border-color:rgba(255,84,112,.3);color:#ff9aaa}.game-btn.green{background:rgba(48,210,141,.10);border-color:rgba(48,210,141,.27);color:#7ce6b5}
.roulette{padding:28px;border-radius:24px;border:1px solid #313a45;background:radial-gradient(circle at center,#1c2430 0,#0d131c 48%,#090d12 100%);text-align:center}
.wheel{width:min(410px,72vw);aspect-ratio:1;border-radius:50%;margin:8px auto 22px;border:15px solid #242b36;outline:2px solid #b0893a;position:relative;transition:transform 3.1s cubic-bezier(.13,.76,.17,1);overflow:hidden}
.pointer{width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid var(--gold);margin:-20px auto 16px}
.roulette-result{font-size:20px;font-weight:900}.bet-options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.bet-option{padding:12px;border-radius:12px;border:1px solid #303b47;background:#101720;color:#fff;cursor:pointer;font-weight:700}.bet-option.active{border-color:var(--gold);background:#1a1710}
.reels{border:1px solid #323c47;border-radius:22px;background:linear-gradient(180deg,#161d27,#090d13);padding:22px;margin-top:14px}
.reel-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:760px;margin:0 auto}
.reel-frame{padding:7px;border-radius:20px;background:linear-gradient(145deg,#6c8a9e,#252e39 38%,#10151b 70%)}
.reel{height:130px;display:grid;place-items:center;border-radius:14px;border:2px solid #677587;background:radial-gradient(circle at 45% 20%,#273143,#10161e 70%);font-size:17px;font-weight:1000;overflow:hidden;position:relative}
.reel.spinning{animation:reelSpinShake .07s linear infinite;filter:blur(1.4px)}
.reel.spinning .slot-symbol{animation:symbolFade .07s linear infinite}
@keyframes reelSpinShake{0%{transform:translateY(-5px)}50%{transform:translateY(5px)}100%{transform:translateY(-5px)}}
@keyframes symbolFade{0%{opacity:.7}100%{opacity:1}}
.slot-symbol{font-size:31px;text-align:center;line-height:1}
.paytable{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.pay{padding:11px;border:1px solid #28313d;border-radius:13px;background:#0c1117}.pay .s{font-weight:900}.pay small{color:var(--muted)}
.slot-legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.legend-card{display:grid;grid-template-columns:45px 1fr;gap:10px;align-items:center;padding:14px;border-radius:16px;border:1px solid #2c3742;background:#0b1118}
.legend-icon{width:45px;height:45px;border-radius:13px;display:grid;place-items:center;font-size:22px;font-weight:1000;background:#161e28;color:var(--gold)}
.dice-board,.crash-board,.bj-table{padding:24px;border:1px solid #2e3845;border-radius:24px;background:radial-gradient(circle at 50% 0,#16202b,#0a0f15 68%);min-height:300px}
.dice-players{display:grid;grid-template-columns:minmax(0,1fr) 74px minmax(0,1fr);gap:14px;align-items:stretch}
.dice-player{padding:18px;border:1px solid #2b3542;border-radius:18px;background:#0d131b;text-align:center;min-height:245px;display:flex;flex-direction:column;justify-content:center}
.dice-pips{font-size:66px;letter-spacing:11px;margin:30px 0 10px;line-height:1}.dice-caption{color:var(--muted);font-size:12px}.sum{font-size:42px;font-weight:1000}.vs{display:grid;place-items:center;color:var(--gold);font-weight:1000}
.crash-board{text-align:center}.crash-chart{height:260px;border:1px solid #2c3541;border-radius:20px;position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,84,112,.035),rgba(48,210,141,.02));margin:12px 0}
.crash-line{position:absolute;left:8%;bottom:11%;height:4px;width:10%;transform-origin:left center;background:linear-gradient(90deg,var(--green),var(--gold),var(--red))}
.crash-mult{font-size:64px;font-weight:1000}
.bj-table{background:radial-gradient(circle at 50% 20%,#1b3a2b,#0b1812 62%,#07100c)}
.cards-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:130px}
.playing-card{width:82px;height:114px;border-radius:12px;background:#f9f7f1;color:#12151a;border:1px solid #dbd4c4;display:flex;flex-direction:column;justify-content:center;padding:8px;font-weight:900;position:relative}
.playing-card.red-suit{color:#c62340}.card-corner{position:absolute;display:flex;flex-direction:column;line-height:.92;align-items:center;font-size:17px}.card-corner.top{left:9px;top:8px}.card-corner.bottom{right:9px;bottom:8px;transform:rotate(180deg)}.card-corner span{font-size:11px}.card-center-suit{font-size:40px;text-align:center}
.playing-card.back{background:repeating-linear-gradient(45deg,#3b1f2b,#3b1f2b 6px,#7f3b4e 6px,#7f3b4e 10px);color:transparent;border-color:#a35a6b}
.playing-card.back .card-back-logo{width:46px;height:62px;border:2px solid rgba(255,235,180,.5);border-radius:7px;display:grid;place-items:center;font-size:15px;color:#ffe3a0;margin:auto}
.bj-hand{text-align:center;margin:14px}.bj-hand h4{margin:0 0 9px;color:#cfdbc9}.bj-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.result-banner{text-align:center;font-size:23px;font-weight:1000;margin:15px 0}
/* MODAL */
.modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:grid;place-items:center;padding:15px}
.modal-card{width:min(700px,calc(100vw - 30px));max-height:88vh;overflow:auto;border:1px solid #3a4552;border-radius:24px;background:#0d131a;padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0;font-size:24px}
.close{border:0;background:#17202b;color:#fff;width:36px;height:36px;border-radius:11px;cursor:pointer}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.shop-item{border:1px solid #2b3540;border-radius:16px;background:#0b1117;padding:14px}
.shop-title{font-weight:900}.shop-desc{font-size:12px;color:var(--muted);margin:5px 0 12px}
.row-between{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag-status{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.settings-list{display:grid;gap:9px;margin-top:15px}.settings-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border:1px solid #2a3440;border-radius:15px;background:#0b1117}
.switch{width:50px;height:28px;border-radius:99px;border:1px solid #334050;background:#1b2430;position:relative;cursor:pointer}.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8c98a7;transition:.2s}.switch.on{background:rgba(48,210,141,.16)}.switch.on i{left:25px;background:var(--green)}
.settings-tabs{display:flex;gap:7px;margin:16px 0 12px;padding:5px;border:1px solid #27313d;border-radius:15px;background:#090e14}
.settings-tab{border:0;background:transparent;color:var(--muted);padding:9px 13px;border-radius:10px;font-weight:800;cursor:pointer}.settings-tab.active{background:#171f29;color:var(--text)}
.settings-panel{display:none}.settings-panel.active{display:block}
.code-box,.credits-hero{border:1px solid #2c3742;border-radius:18px;background:linear-gradient(145deg,#101720,#0a0f14);padding:18px}
.code-box h3{margin:8px 0 5px}.code-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
.code-status{margin-top:13px;padding:11px 13px;border-radius:12px;background:#0b1117;color:var(--muted);font-size:12px}
.success-text{color:var(--green)}.error-text{color:var(--red)}
.toast-stack{position:fixed;right:18px;bottom:18px;z-index:70;display:grid;gap:10px}
.toast{min-width:270px;max-width:380px;padding:13px 15px;border-radius:15px;border:1px solid #384351;background:#0d131a;animation:toastIn .25s ease}
.toast strong{display:block}.toast small{display:block;color:var(--muted);margin-top:3px}
@keyframes toastIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.author-panel{margin-top:18px}.author-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.author-card{padding:16px;border:1px solid #2d3742;border-radius:16px;background:linear-gradient(145deg,#0c1219,#0a0f15);display:grid;gap:4px}
.author-card.wide{grid-column:1/-1}.author-badge{font-size:9px;letter-spacing:.14em;color:var(--gold);font-weight:900}.author-card strong{font-size:19px}.author-card small{color:var(--muted)}
.roulette-number-strip{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:900px;margin:10px auto 2px}
.mini-number{min-width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:900;border:1px solid #303947}
.mini-number.red{background:#5c1828;color:#ffacb8}.mini-number.black{background:#11151a;color:#d9dce2}.mini-number.green{background:#0f6045;color:#8ff0c8}
.wheel-numbers{position:absolute;inset:0;z-index:2}.wheel-number{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:1000;color:#fff;min-width:18px;text-align:center}
.wheel-number.zero{color:#d9ffe9;background:rgba(13,120,78,.86);border-radius:5px;padding:2px 3px}
.wheel-center{position:absolute;inset:31%;z-index:3;border-radius:50%;background:radial-gradient(circle,#e5bf63,#745720 70%);display:grid;place-items:center;color:#17120a;font-weight:1000;font-size:48px}
.roulette-note{display:flex;justify-content:center;gap:12px;align-items:center;color:var(--muted);font-size:11px;margin:-5px 0 12px}
.zero-dot{width:8px;height:8px;border-radius:50%;background:#18a66d}
.slot-machine{padding:18px 20px 20px}.slot-marquee{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 12px;margin:-4px -2px 14px;border-bottom:1px solid rgba(243,201,105,.16);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:900}
.slot-lights{font-size:11px;letter-spacing:6px;color:#ffd66e}
.slot-window{padding:14px;border:2px solid #7c6231;border-radius:24px;background:linear-gradient(180deg,#252d37,#0c1219)}
/* avatar picker */
.avatar-picker{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.avatar-option{width:70px;height:70px;border-radius:50%;border:3px solid #2c3742;background:#0c1117;padding:3px;cursor:pointer;transition:.2s;display:grid;place-items:center}
.avatar-option.selected{border-color:var(--gold);box-shadow:0 0 18px rgba(243,201,105,.4)}
.avatar-option img{width:100%;height:100%;border-radius:50%;object-fit:cover}
/* DONATE */
.donate-hero{max-width:680px;margin:0 auto;border:1px solid #3b2a44;border-radius:26px;padding:34px;background:linear-gradient(140deg,rgba(80,40,90,.5),rgba(17,20,25,.95) 50%,rgba(40,20,50,.98));text-align:center;position:relative;overflow:hidden}
.donate-hero h1{font-size:46px;line-height:1.05;margin:12px 0 14px}.donate-hero h1 span{color:#ff86b7}
.donate-hero p{color:#c6b0c9;line-height:1.65;margin:0 auto 22px;max-width:520px}
.donate-balance{font-size:16px;color:var(--muted);margin-bottom:14px}.donate-balance b{color:var(--gold);font-size:22px}
.donate-presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.donate-input-row{display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.donate-input-row .input{width:200px;text-align:center;font-size:18px;font-weight:800}
.donate-counter{padding:16px;border-radius:16px;background:#0b1016;border:1px solid #2c2c3e;font-size:14px;color:var(--muted)}
.donate-counter b{color:#ff86b7;font-size:22px;display:block;margin-top:4px}
.donate-fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.donate-particle{position:absolute;top:50%;pointer-events:none;opacity:0}
.donate-particle.left{left:-30px;animation:donateFloatLeft var(--dur,2s) ease-out forwards}
.donate-particle.right{right:-30px;animation:donateFloatRight var(--dur,2s) ease-out forwards}
@keyframes donateFloatLeft{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx,15vw),calc(-50vh + var(--dy,20vh))) rotate(360deg)}}
@keyframes donateFloatRight{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx,-15vw),calc(-50vh + var(--dy,20vh))) rotate(-360deg)}}
.cursor-diamond{position:fixed;pointer-events:none;z-index:55;color:#8ec5ff;transform:translate(-50%,-50%);opacity:.7;animation:diamondFade .9s ease-out forwards}
@keyframes diamondFade{0%{opacity:.8}100%{opacity:0;transform:translate(-50%,-50%) scale(.3) translateY(15px)}}
/* BONUS GAME */

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.floor(n).toLocaleString('ru-RU');
const pick=a=>a[Math.floor(Math.random()*a.length)];
const START=100,KEY='egor-casino-43';

// Аватары (можно легко добавить новые — id и SVG data-uri)
const AVATAR_SVG=(skin,hair,bg)=>`data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='bg' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${bg}'/><stop offset='1' stop-color='%23000'/></linearGradient></defs><rect width='100' height='100' fill='url(%23bg)'/><circle cx='50' cy='42' r='19' fill='${skin}'/><path d='M28 42 Q28 18 50 16 Q72 18 72 42 L72 34 Q68 22 50 20 Q32 22 28 34 Z' fill='${hair}'/><path d='M22 100 Q28 68 50 68 Q72 68 78 100 Z' fill='%231b1f24'/></svg>`;
const avatars=[
  {id:'egor',url:AVATAR_SVG('%23e8c9a0','%233a2a18','%234a3a28'),name:'Егор'},
  {id:'smoke',url:AVATAR_SVG('%23d8b898','%23222','%233a2a3a'),name:'Dark'},
  {id:'light',url:AVATAR_SVG('%23f0d5b0','%23603010','%235a4a2a'),name:'Classic'}
];

const rouletteWheel=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const reds=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const symbols=[
{name:'ВИШНЯ',icon:'🍒',color:'#ff5470',trip:13,b3:1,b4:3,b5:8},
{name:'ЛИМОН',icon:'🍋',color:'#f1c65c',trip:17,b3:1,b4:4,b5:10},

const shop=[

{name:'Diamond Trail',price:4000,desc:'Алмазный след за курсором'},
{name:'Fire Border',price:7000,desc:'Огненная линия над шапкой'},

const ach=[
['First Win','Выиграть первый раунд'],['Triple 777','Три 777 в слотах'],['Bonus Hunter','5 бонус-игр слотов'],
['High Roller','10 000 Егориков'],['All-In Champion','Победить ва-банк'],['Crash Master','Забрать x10+'],
['Blackjack!','Натуральный 21'],['Big Win','Выиграть 1000+ за раунд'],['Philanthropist','Пожертвовать 500 E']];
const missions=[
{id:'roulette',name:'Рулеточный профи',desc:'10 выигрышных ставок в рулетке',need:10,reward:500},
{id:'slots',name:'Охотник за бонусами',desc:'5 бонус-игр в слотах',need:5,reward:500},
{id:'blackjack',name:'21 очко',desc:'5 побед в Blackjack',need:5,reward:500}];
const VIP=[{min:0,name:'—',minBet:1,color:'#8f99a8'},{min:1000,name:'БРОНЗОВЫЙ',minBet:100,color:'#cd7f32'},{min:10000,name:'ЗОЛОТОЙ',minBet:500,color:'#f3c969'},{min:50000,name:'АЛМАЗНЫЙ',minBet:1000,color:'#55d9ff'}];
const def=()=>({name:'',avatar:0,nameBonusGiven:false,balance:START,totalBet:0,totalWon:0,biggestWin:0,games:0,wins:0,losses:0,xp:0,level:1,
 shopOwned:Array(shop.length).fill(false),shopEquipped:Array(shop.length).fill(false),ach:Array(ach.length).fill(false),
 lastDaily:0,hist:[],vip:0,totalDonated:0,anim:true,sound:true,speed:100,
 missions:{roulette:0,slots:0,blackjack:0},missionDone:{roulette:false,slots:false,blackjack:false},pendingBonus:false});
let state=load(),currentGame=null,roulettePick={type:'red'},wheelRotation=0,audioCtx=null,trailOn=false,lastTrail=0;

function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||'{}');const s={...def(),...r};
 if(typeof s.vip==='boolean')s.vip=s.vip?1:0;
 if(!Array.isArray(s.shopOwned)||s.shopOwned.length!==shop.length){const o=s.shopOwned||[];s.shopOwned=Array(shop.length).fill(false).map((_,i)=>!!o[i])}
 if(!Array.isArray(s.shopEquipped)||s.shopEquipped.length!==shop.length){const o=s.shopEquipped||[];s.shopEquipped=Array(shop.length).fill(false).map((_,i)=>!!o[i])}
 if(!Array.isArray(s.ach)||s.ach.length!==ach.length){const o=s.ach||[];s.ach=Array(ach.length).fill(false).map((_,i)=>!!o[i])}
 if(typeof s.avatar!=='number'||s.avatar<0||s.avatar>=avatars.length)s.avatar=0;
 return s}catch{return def()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function vLvl(){const w=state.totalWon||0;if(w>=50000)return 3;if(w>=10000)return 2;if(w>=1000)return 1;return 0}
function vMin(){return VIP[vLvl()].minBet}
function addMoney(n){state.balance+=n;state.balance=Math.max(0,state.balance)}
function addXp(n){state.xp+=n;const nl=Math.floor(state.xp/100)+1;if(nl>state.level){state.level=nl;addMoney(50*state.level);toast('Новый уровень','Уровень '+state.level+' · +'+(50*state.level)+' E');sound('level')}}
function pushHist(v){state.hist.unshift(v);state.hist=state.hist.slice(0,10)}
function unlock(i){if(state.ach[i])return;state.ach[i]=true;addMoney(100);toast('Достижение: '+ach[i][0],'+100 E');sound('win');save();updateTop()}
function mission(id){const M=missions.find(x=>x.id===id);const v=state.missions[id]??0;return M?clamp(v,0,M.need):v}
function tick(id){state.missions[id]=(state.missions[id]||0)+1;const m=missions.find(x=>x.id===id);if(m&&!state.missionDone[id]&&state.missions[id]>=m.need){state.missionDone[id]=true;addMoney(m.reward);toast('Миссия: '+m.name,'+'+m.reward+' E');sound('win')}}
function settle(bet,pay,meta={}){const net=pay-bet;state.totalBet+=bet;state.games++;
 if(net>0){state.wins++;state.totalWon=(state.totalWon||0)+net;pushHist('W');state.biggestWin=Math.max(state.biggestWin,net);
  if(net>=1000)unlock(7);if(!state.ach[0])unlock(0);addXp(2);sound('win');
  const nv=vLvl();if(nv>state.vip){state.vip=nv;toast('VIP '+VIP[nv].name,'Минимум: '+VIP[nv].minBet+' E');sound('bonus')}}
 else if(net<0){state.losses++;pushHist('L');addXp(1);sound('lose')}
 else{pushHist('P');addXp(1)}
 addMoney(pay);if(state.balance>=10000)unlock(3);if(meta.allIn&&net>0)unlock(4);save();updateTop();return net}
function daily(){const n=Date.now();if(state.lastDaily&&n-state.lastDaily<86400000)return;const v=pick([25,50,75,100,200]);addMoney(v);state.lastDaily=n;save();toast('Ежедневный бонус','+'+v+' E');sound('coin')}
function tone(f,d=.12,t='sine',v=.045,dl=0){if(!state.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const n=audioCtx.currentTime+dl;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audioCtx.destination);o.start(n);o.stop(n+d+.02)}catch{}}
function sound(kind){if(!state.sound)return;const p={click:[[430,.06,'sine',.025,0]],win:[[660,.10,'sine',.035,0],[830,.12,'sine',.04,.07],[1040,.18,'triangle',.035,.15]],lose:[[250,.16,'sine',.035,0],[190,.20,'triangle',.03,.09]],coin:[[880,.07,'triangle',.035,0],[1175,.13,'sine',.03,.06]],level:[[523,.10,'triangle',.03,0],[659,.10,'triangle',.03,.07],[784,.18,'triangle',.04,.14]],reel:[[220,.045,'square',.018,0]],wheel:[[150,.08,'triangle',.02,0],[190,.10,'triangle',.025,.08]],dice:[[300,.07,'square',.025,0],[420,.10,'square',.025,.07]],blackjack:[[523,.10,'triangle',.03,0],[659,.10,'triangle',.03,.08],[988,.18,'triangle',.04,.16]],bonus:[[523,.09,'triangle',.025,0],[659,.09,'triangle',.03,.07],[784,.11,'triangle',.03,.14],[1047,.22,'triangle',.035,.23]],crash:[[180,.10,'sawtooth',.035,0],[120,.28,'sawtooth',.03,.08]]};(p[kind]||p.click).forEach(([f,d,t,v,dl])=>tone(f,d,t,v,dl))}

 [['5%',.05],['10%',.10],['25%',.25],['50%',.50],['MAX',1]].forEach(([l,f])=>{let v=f===1?b:Math.floor(b*f);if(v<mn)v=mn;if(v>b)v=b;if(v<1)return;if(seen.has(v))return;seen.add(v);

function renderHome(){
 const recent=state.hist.length?state.hist.map(x=>'<span style="color:'+(x==='W'?'var(--green)':x==='L'?'var(--red)':'var(--muted)')+'">'+x+'</span>').join(' '):'—';
 const l=vLvl();const vipBlock=l>0?'<div class="vip vip-lvl-'+l+'"><strong style="color:'+VIP[l].color+'">VIP '+VIP[l].name+'</strong><div class="muted">Минимум: '+VIP[l].minBet+' E</div></div>':'<div class="vip"><strong>VIP ПРОГРЕСС</strong><div class="muted">Нужно 1000 E · ещё '+fmt(Math.max(0,1000-(state.totalWon||0)))+' E</div></div>';

 if(net>0){state.wins++;state.totalWon=(state.totalWon||0)+net;pushHist('W');addXp(2)}else if(net<0){state.losses++;pushHist('L');addXp(1)}else pushHist('P');
 toast('Split завершён',net>=0?'+'+net:'-'+Math.abs(net));save();updateTop();tick('blackjack');$('#playBtn').disabled=false}
async function finishBJ(b,pay){b.reveal=true;while(hVal(b.dealer)<17){b.dealer.push(nCard());renderBJ(b);await sleep(state.anim?350:20)}renderBJ(b);
 const pv=hVal(b.player),dv=hVal(b.dealer);let p=pay;
 if(p===null){if(pv>21)p=0;else if(dv>21||pv>dv)p=b.bet*2;else if(pv===dv)p=b.bet;else p=0}
 $('#bjActions').innerHTML='';
 $('#bjResult').textContent=pv>21?'BUST':p>b.bet?'Победа':p===b.bet?'Ничья':'Проигрыш';
 if(p>b.bet)tick('blackjack');settle(b.bet,p,{allIn:b.bet===state.balance+b.bet});$('#playBtn').disabled=false}

/* ============ CRASH ============ */
function crash(){currentGame='crash';
 shell('Crash','Множитель растёт · авто или ручной cash-out',betCard()+'<div class="crash-board"><div class="crash-chart"><div id="crashLine" class="crash-line"></div><div id="crashMult" class="crash-mult" style="padding-top:80px">1.00x</div></div><div id="crashStatus" class="muted">Ждём ставку</div><div class="control-row" style="justify-content:center;margin-top:12px"><div class="field"><label>Авто cash (0=выкл)</label><input id="autoCash" class="input" type="number" min="1.01" step="0.01" value="2.00"></div><button class="game-btn green" id="cashBtn" disabled>CASH OUT</button></div></div>');
 moneyOptions($('#presetRow'));$('#playBtn').onclick=startC}
async function startC(){const bet=readBet();if(!bet)return;let auto=Number($('#autoCash').value||0);if(auto<1.01)auto=0;
 state.balance-=bet;updateTop();$('#playBtn').disabled=true;$('#cashBtn').disabled=false;
 $('#crashStatus').textContent='Игра началась';
 const u=Math.random();let cp=clamp(.97/(1-Math.max(.03,u)),1,500),m=1,cashed=false;
 const line=$('#crashLine');
 const cash=()=>{if(cashed)return;cashed=true;const win=Math.floor(bet*m);$('#cashBtn').disabled=true;
  $('#crashStatus').innerHTML='Забрано на <b>'+m.toFixed(2)+'x</b> · Crash был '+cp.toFixed(2)+'x';
  if(m>=10)unlock(5);settle(bet,win,{allIn:bet===state.balance+bet})};
 $('#cashBtn').onclick=cash;
 while(m<cp&&!cashed){await sleep(55);m*=1.005735;
  $('#crashMult').textContent=m.toFixed(2)+'x';
  $('#crashMult').style.color=m>=20?'var(--red)':m>=5?'var(--gold)':m>=2?'var(--cyan)':'var(--green)';
  line.style.width=clamp((m-1)/6*82,5,82)+'%';line.style.transform='rotate('+clamp(-(m-1)*8,-43,2)+'deg)';
  if(auto&&m>=auto)cash()}
 if(!cashed){await sleep(120);$('#crashStatus').innerHTML='<b style="color:var(--red)">CRASHED at '+cp.toFixed(2)+'x</b>';sound('crash');settle(bet,0,{allIn:bet===state.balance+bet})}
 $('#playBtn').disabled=false;$('#cashBtn').disabled=true}

/* ============ DONATE ============ */
function showDonate(){currentGame=null;$('#homeView').classList.remove('active');$('#gameView').classList.remove('active');$('#donateView').classList.add('active');renderDonate();window.scrollTo({top:0,behavior:'smooth'});updateTop()}
function renderDonate(){const b=state.balance||0;
 $('#donateView').innerHTML='<button class="back" data-action="home" style="margin-bottom:14px">← Назад</button><div class="donate-hero"><div class="eyebrow">SUPPORT</div><h1>Поддержи <span>Егора</span></h1><p>Пожертвуй Егорики на Кока-Колу. Локальная игра, реальных денег нет.</p><div class="donate-balance">Баланс: <b id="donateBalance">'+fmt(b)+' E</b></div><div class="donate-presets" id="donatePresets"></div><div class="donate-input-row"><input id="donateInput" class="input" type="number" min="1" value="'+Math.max(1,Math.min(b||100,100))+'"><button class="game-btn primary-gold" id="donateBtn">Пожертвовать 💝</button></div><div class="donate-counter">Всего пожертвовано: <b id="donateTotal">'+fmt(state.totalDonated||0)+' E</b></div><div class="muted" style="margin-top:8px;font-size:12px">Достижение «Philanthropist» откроется при 500 E.</div></div><div class="donate-fx" id="donateFx"></div>';
 const pr=$('#donatePresets'),opts=[50,100,250,500,1000,5000].filter(v=>v<=b);if(!opts.length)opts.push(Math.max(1,b));
 opts.forEach(v=>{const btn=document.createElement('button');btn.className='preset';btn.textContent=fmt(v)+' E';btn.onclick=()=>{const i=$('#donateInput');if(i)i.value=v;sound('click')};pr.appendChild(btn)});
 $('#donateBtn').onclick=doDon}
function doDon(){const v=Math.floor(Number($('#donateInput')?.value||0));if(!v||v<1){toast('Ошибка','Укажи сумму');return}
 if(v>state.balance){toast('Мало средств','Баланс '+fmt(state.balance)+' E');return}
 state.balance-=v;state.totalDonated=(state.totalDonated||0)+v;addXp(1);
 if(state.totalDonated>=500&&!state.ach[8])unlock(8);
 save();updateTop();
 $('#donateBalance').textContent=fmt(state.balance)+' E';$('#donateTotal').textContent=fmt(state.totalDonated)+' E';
 spawnFx();sound('coin');toast('Спасибо!','+'+fmt(v)+' E на Кока-Колу')}
function spawnFx(){const fx=$('#donateFx');if(!fx)return;const em=['💰','💎','🪙','💵','✨','⭐','🍒','🍋'];
 ['left','right'].forEach(side=>{for(let i=0;i<22;i++){setTimeout(()=>{const el=document.createElement('div');el.className='donate-particle '+side;el.textContent=em[Math.floor(Math.random()*em.length)];
  el.style.setProperty('--dur',(1.6+Math.random()*1.4)+'s');el.style.setProperty('--dx',((side==='left'?1:-1)*(10+Math.random()*30))+'vw');el.style.setProperty('--dy',(Math.random()*40)+'vh');el.style.fontSize=(20+Math.random()*22)+'px';
  fx.appendChild(el);setTimeout(()=>el.remove(),3200)},i*40)}})}

/* ============ SHOP ============ */
function applyShop(){document.body.dataset.frame=state.shopEquipped[0]?'1':'0';document.body.dataset.neon=state.shopEquipped[1]?'1':'0';document.body.dataset.clover=state.shopEquipped[2]?'1':'0';document.body.dataset.diamond=state.shopEquipped[3]?'1':'0';document.body.dataset.fire=state.shopEquipped[4]?'1':'0';document.body.dataset.crown=state.shopEquipped[5]?'1':'0';
 if(state.shopEquipped[3]&&!trailOn){trailOn=true;document.addEventListener('mousemove',trailHandler)}else if(!state.shopEquipped[3]&&trailOn){trailOn=false;document.removeEventListener('mousemove',trailHandler)}
 updateName()}
function trailHandler(e){const n=performance.now();if(n-lastTrail<42)return;lastTrail=n;
 const el=document.createElement('div');el.className='cursor-diamond';el.textContent=Math.random()>0.6?'◆':'✦';el.style.left=e.clientX+'px';el.style.top=e.clientY+'px';el.style.fontSize=(8+Math.random()*10)+'px';
 document.body.appendChild(el);setTimeout(()=>el.remove(),900)}
function shopModal(){openModal('МАГАЗИН','<div class="shop-grid">'+shop.map((x,i)=>'<div class="shop-item '+(state.shopOwned[i]?'owned':'')+'"><div class="row-between"><div class="shop-title">'+x.name+'</div><div class="tag-status">'+(state.shopEquipped[i]?'ВКЛ':state.shopOwned[i]?'КУПЛЕНО':x.price+' E')+'</div></div><div class="shop-desc">'+x.desc+'</div><button class="game-btn '+(state.shopEquipped[i]?'red':'primary-gold')+'" data-shop="'+i+'">'+(state.shopOwned[i]?(state.shopEquipped[i]?'Снять':'Надеть'):'Купить за '+x.price+' E')+'</button></div>').join('')+'</div>');
 $$('[data-shop]').forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.shop;
  if(!state.shopOwned[i]){if(state.balance<shop[i].price){toast('Мало средств','Нужно '+shop[i].price+' E');return}state.balance-=shop[i].price;state.shopOwned[i]=true;state.shopEquipped[i]=true;toast('Куплено',shop[i].name);sound('coin')}
  else state.shopEquipped[i]=!state.shopEquipped[i];
  save();updateTop();shopModal()});applyShop()}

/* ============ SETTINGS ============ */
function settingsModal(tab='general'){const a=t=>t===tab?' active':'';
 openModal('НАСТРОЙКИ','<div class="settings-tabs"><button class="settings-tab'+a('general')+'" data-st="general">Общие</button><button class="settings-tab'+a('codes')+'" data-st="codes">Коды</button><button class="settings-tab'+a('credits')+'" data-st="credits">Авторство</button></div><div class="settings-panels"><section class="settings-panel'+(tab==='general'?' active':'')+'" data-sp="general"><div class="settings-list"><div class="settings-row"><div><b>Анимации</b><div class="muted">Игровые эффекты</div></div><button class="switch '+(state.anim?'on':'')+'" data-set="anim"><i></i></button></div><div class="settings-row"><div><b>Звук</b><div class="muted">Сигналы и эффекты</div></div><button class="switch '+(state.sound?'on':'')+'" data-set="sound"><i></i></button></div><div class="settings-row"><div><b>Скорость</b><div class="muted">100% = стандарт</div></div><input id="speedRange" type="range" min="50" max="200" value="'+state.speed+'"></div><div class="settings-row"><div><b>Сброс сохранения</b><div class="muted">Удалит всё, как в первый раз</div></div><button class="danger" data-reset>Сброс</button></div><div class="settings-row"><div><b>Скачать</b><div class="muted">JSON-бэкап</div></div><button class="secondary" data-export>Экспорт</button></div><div class="settings-row"><div><b>Загрузить</b><div class="muted">Импорт JSON</div></div><label class="secondary" style="display:inline-flex;align-items:center;cursor:pointer">Импорт<input id="importFile" type="file" accept="application/json" hidden></label></div></div></section><section class="settings-panel'+(tab==='codes'?' active':'')+'" data-sp="codes"><div class="code-box"><div class="eyebrow">СИСТЕМНЫЕ КОДЫ</div><h3>Введите код</h3><p class="muted">Раздел для разработчиков.</p><div class="code-row"><input id="codeInput" class="input" autocomplete="off" placeholder="код"><button class="game-btn primary-gold" id="codeApply">Активировать</button></div><div id="codeStatus" class="code-status">Введите код.</div></div></section><section class="settings-panel'+(tab==='credits'?' active':'')+'" data-sp="credits"><div class="credits-hero"><div class="eyebrow">CREATED FOR EGOR CASINO</div><h3>Команда</h3><div class="author-grid" style="margin-top:14px"><div class="author-card"><span class="author-badge">MAIN DEV</span><strong>Егор</strong><small>Главный разработчик</small></div><div class="author-card"><span class="author-badge">SPONSOR</span><strong>Калядка</strong><small>Спонсор</small></div><div class="author-card wide"><span class="author-badge">THANKS</span><strong>ChatGPT · DeepSeek · Claude</strong><small>Инструменты проекта</small></div></div></div></section></div>');
 $$('[data-st]').forEach(b=>b.onclick=()=>settingsModal(b.dataset.st));
 $$('[data-set]').forEach(b=>b.onclick=()=>{state[b.dataset.set]=!state[b.dataset.set];save();settingsModal(tab)});
 $('#speedRange')?.addEventListener('input',e=>{state.speed=+e.target.value;save()});
 $('[data-reset]')?.addEventListener('click',()=>{if(confirm('Сбросить всё?')){closeModal();resetState()}});
 $('[data-export]')?.addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='egor-save.json';a.click()});
 $('#importFile')?.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state={...def(),...JSON.parse(r.result)};save();updateTop();closeModal();home();toast('Импорт ОК')}catch{toast('Ошибка','Неверный JSON')}};r.readAsText(f)});
 $('#codeApply')?.addEventListener('click',()=>{const c=$('#codeInput').value.trim().toLowerCase(),st=$('#codeStatus');
  if(c==='money'){addMoney(10000);save();updateTop();st.innerHTML='<b class="success-text">OK:</b> +10 000 E';sound('coin');return}
  if(c==='bonus'){state.pendingBonus=true;save();st.innerHTML='<b class="success-text">OK:</b> следующий слот даст бонус';sound('bonus');return}
  st.innerHTML='<b class="error-text">Неизвестный код.</b>'})}
function resetState(){state=def();save();updateTop();renderHome();$$('.view').forEach(v=>v.classList.remove('active'));$('#homeView').classList.add('active');toast('Сброшено','Всё как в первый раз');setTimeout(nameModal,300)}

function nameModal(){
 const cur=state.name||'';
 openModal('ПРОФИЛЬ','<div class="code-box"><div class="eyebrow">ИМЯ И АВАТАР</div><h3>Настрой свой профиль</h3><p class="muted">Имя и аватар можно менять в любой момент — кнопка профиля справа сверху.</p><div class="code-row"><input id="nameInput" class="input" autocomplete="off" maxlength="20" placeholder="Введи имя" value="'+cur+'"><button class="game-btn primary-gold" id="nameApply">Сохранить</button></div><div class="eyebrow" style="margin-top:18px">АВАТАР</div><div class="avatar-picker" id="avatarPicker">'+avatars.map((a,i)=>'<button class="avatar-option '+(state.avatar===i?'selected':'')+'" data-av="'+i+'"><img src="'+a.url+'" alt="'+a.name+'"></button>').join('')+'</div></div>');

   toast('Бонус','+10 000 E');
   sound('bonus');
  }
  save();updateTop();renderHome();closeModal();
  if(!isFirst) sound('win');
 };
 $('#nameApply').onclick=apply;
 inp?.addEventListener('keydown',e=>{if(e.key==='Enter')apply()});
}

 $('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};$('[data-close]').onclick=closeModal}
function closeModal(){$('#modalRoot').innerHTML=''}

document.addEventListener('click',e=>{
 const g=e.target.closest('[data-game]')?.dataset.game;if(g){startGame(g);return}

 if(a==='home')home();else if(a==='settings')settingsModal();else if(a==='shop')shopModal();else if(a==='achievements')achModal();else if(a==='stats')statsModal();else if(a==='rules')rulesModal();else if(a==='random-game')randomGame();else if(a==='donate')showDonate();else if(a==='edit-name')nameModal()});

applyShop();daily();renderHome();updateTop();

</script>
