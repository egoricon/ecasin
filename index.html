<meta name="theme-color" content="#FFFFFF" id="themeColor">
<!-- Тема до первой отрисовки, чтобы не мигало: учёба — БГУИР, казино — неон -->
<script>
  (function () {
    var casino = false;
    try {
      var s = JSON.parse(localStorage.getItem('egor-casino-v3') || 'null');
      if (s) casino = s.progress ? !!(s.progress.casinoUnlocked && s.progress.mode === 'casino') : (s.games > 0 || s.balance > 100) && s.mode !== 'earn';
      if (/^#\/(study|earn)/.test(location.hash)) casino = false;
    } catch (e) {}
    document.documentElement.dataset.theme = casino ? 'neon' : 'bsuir';
    document.getElementById('themeColor').content = casino ? '#07060D' : '#FFFFFF';
  })();
</script>

<!-- Экран загрузки: закрывает пустую страницу, пока скрипты не готовы -->
<div class="boot" id="boot" aria-hidden="true"><div class="boot-in"><span class="boot-logo">E</span><span class="boot-bar"><i></i></span></div></div>

<header class="topbar">
  <button class="brand" data-go="home" aria-label="На главный экран"><span id="brandA">ЕГОР</span> <em id="brandB">БОТАЕТ</em></button>
  <div class="top-mid">
    <div class="seg" role="group" aria-label="Режим" id="modeSeg" hidden>
      <button data-go="casino" data-mode-btn="casino" aria-pressed="false">Депать</button>
      <button data-go="study" data-mode-btn="study" aria-pressed="true">Ботать</button>
    </div>
  </div>
  <div class="top-bal">
    <div class="bal" id="balPill" title="Баланс"><i aria-hidden="true">◆</i><b id="balNum"></b><span class="clover" id="balClover" aria-label="Клевер удачи"></span><span>Егориков</span></div>
    <span class="online" id="online" aria-label="Игроков онлайн" hidden><i></i><span id="onlineNum">427</span> онлайн</span>
  </div>
  <div class="top-right">
    <button class="who" data-go="profile" aria-label="Профиль"><span class="av" id="whoAv"></span><span class="who-txt"><span class="who-name" id="whoName"></span><span id="whoTitle"></span></span></button>
    <button class="btn b-gho icon" data-go="donate" id="donateBtn" aria-label="Поддержать Егора" title="Поддержать Егора" hidden>💝</button>
    <button class="btn b-gho icon" data-go="settings" aria-label="Настройки" title="Настройки">⚙️</button>
  </div>
</header>

<main class="shell" id="main">
  <section id="homeView" class="view" aria-label="Лобби казино"></section>
  <section id="gameView" class="view" aria-label="Стол"></section>
  <section id="donateView" class="view" aria-label="Донат"></section>
  <section id="studyView" class="view" aria-label="Учёба"></section>
</main>

<div id="notes" class="notes" aria-live="polite"></div>
<div id="modalRoot"></div>

<div class="ticker" id="ticker" aria-hidden="true" hidden><span class="live"><i></i>LIVE</span><div class="ticker-track" id="tickerTrack"></div></div>
<aside class="chat" id="chat" aria-label="Лайв-чат" hidden>
